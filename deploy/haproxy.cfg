# jailhub behind HAProxy (ARCHITECTURE.md §8.5): TCP mode, SNI routing, PROXY protocol v2.
#
# jailhub side:
#   jailhub serve --base-url https://hub.example.com --listen 127.0.0.1:8443 --proxy-protocol ...

global
    log stdout format raw local0
    maxconn 20000

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  1h        # WebSocket / control channels stay open for a long time
    timeout server  1h

frontend https_in
    bind :443
    bind :::443 v4v6
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }   # wait for the ClientHello

    # Everything under the hub name goes to jailhub; user domains (ARCHITECTURE.md §8.3) too.
    acl is_jailhub req.ssl_sni -m end .hub.example.com
    acl is_jailhub req.ssl_sni -i hub.example.com
    # acl is_jailhub req.ssl_sni -i app.example.org

    use_backend jailhub if is_jailhub
    default_backend existing_https

backend jailhub
    server hub 127.0.0.1:8443 send-proxy-v2 check   # PROXY v2; jailhub reads v1 and v2

backend existing_https
    server local 127.0.0.1:8444

# Raw TCP links (ARCHITECTURE.md §8.4), port for port. Add one pair per published port, or let
# jailhub own the whole range directly and open it in the firewall instead.
# listen raw_10000
#     bind :10000
#     server hub 127.0.0.1:10000 send-proxy-v2

