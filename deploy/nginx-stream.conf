# jailhub behind nginx (DESIGN.md §9.6). nginx never opens TLS: it forwards TCP bytes and
# tells jailhub who the visitor was with a PROXY header. Put this at the top level of
# nginx.conf (next to `http { }`), not inside it. Needs the stream module (ngx_stream_core,
# ngx_stream_ssl_preread), which Debian/Ubuntu ship in nginx-full / libnginx-mod-stream.
#
# jailhub side:
#   jailhub serve --base-url https://hub.example.com --listen 127.0.0.1:8443 --proxy-protocol \
#                 --port-range 10000-10999 --http-listen 127.0.0.1:8080 ...
# --proxy-protocol is accepted because --listen is loopback; from another host you would add
# --trusted-proxy <nginx ip>/32.

stream {
    # Route by SNI: everything under hub.example.com goes to jailhub, the rest to whatever
    # already served 443 on this machine (a local nginx `http { }` on 8444, for example).
    map $ssl_preread_server_name $jailscale_upstream {
        hostnames;
        hub.example.com     jailhub;
        *.hub.example.com   jailhub;
        # user domains (DESIGN.md §9.4) that CNAME to this host:
        # app.example.org   jailhub;
        default             existing_https;
    }

    upstream jailhub        { server 127.0.0.1:8443; }
    upstream existing_https { server 127.0.0.1:8444; }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;                  # read the ClientHello's SNI without terminating TLS
        proxy_pass $jailscale_upstream;
        proxy_protocol on;               # PROXY v1 header with the visitor's address
        proxy_connect_timeout 5s;
        proxy_timeout 1h;                # long-lived WebSocket / control channels
    }

    # Raw TCP links (DESIGN.md §9.5) can be proxied the same way, port for port:
    # server { listen 10000-10999; proxy_pass 127.0.0.1:$server_port; proxy_protocol on; }
    # (a port range in `listen` needs nginx >= 1.15.10). UDP links need `listen ... udp`
    # without proxy_protocol; jailhub does not read PROXY headers on UDP.
}

# Port 80 is only needed for user domains (ACME http-01 relay, DESIGN.md §9.4).
# If nginx `http { }` already owns 80, forward just the challenge path:
#
