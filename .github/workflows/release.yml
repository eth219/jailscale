# Release build (DESIGN.md §14 M4): native binaries for five platforms plus the fallback JARs,
# attached to the GitHub release of the pushed tag. Triggered by tags like v0.1.0.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15,         target: darwin-arm64 }
          - { os: macos-15-intel,   target: darwin-amd64 }
          - { os: windows-2025,     target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Liberica NIK rather than GraalVM CE, and JDK 25.0.3 or newer, on purpose (DESIGN.md §4).
      # JDK 25.0.0-25.0.2 lose timed virtual-thread wake-ups once a delayed task is cancelled
      # (JDK-8370887, with JDK-8369227 next to it); a hand-off cancels the old connections'
      # keepalive sleeps, and HandoffTest then stalled on one or two runners per run. Both fixes
      # are in 25.0.3. This action's graalvm-community line stops at jdk-25.0.2 and has no macOS
      # x64 build after 25.0.1, so it cannot deliver a fixed JDK to all five targets; its liberica
      # line resolves '25' to the newest jdk-25.0.x tag (25.0.4 today) and ships every target.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'liberica'
          native-image-job-reports: 'true'
      - name: Set version from the tag
        # Without this the binaries report the pom's 0.x.y-SNAPSHOT no matter which tag built them.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build (tests + native)
        run: ./mvnw -B -ntp -Pnative package
        shell: bash
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ matrix.target }}" = windows-amd64 ] && ext=.exe
          cp jailscale-node/target/jailscale$ext dist/jailscale-${{ matrix.target }}$ext
          cp jailscale-hub/target/jailhub$ext   dist/jailhub-${{ matrix.target }}$ext
          if [ "${{ matrix.target }}" = linux-amd64 ]; then
            cp jailscale-node/target/jailscale.jar dist/jailscale.jar
            cp jailscale-hub/target/jailhub.jar   dist/jailhub.jar
          fi
          # macOS ships shasum and no sha256sum; the Windows runner's bash is the other way
          # round. Both print the same "<hash>  <name>" that the release job concatenates.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: native
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Merge checksums
        run: cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt && rm dist/SHA256SUMS-*.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
