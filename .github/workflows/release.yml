# Release build (ARCHITECTURE.md §14): native binaries for four platforms plus the fallback JARs,
# attached to the GitHub release of the pushed tag. Triggered by tags like v0.1.0.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15,         target: darwin-arm64 }
          - { os: windows-2025,     target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # GraalVM CE on the 25.3 line, and a JDK newer than 25.0.2, both on purpose (§3.2, §14).
      # JDK 25.0.0-25.0.2 lose timed virtual-thread wake-ups once a delayed task is cancelled
      # (JDK-8370887, with JDK-8369227 next to it); a hand-off cancels the old connections'
      # keepalive sleeps, and HandoffTest then stalled on one or two runners per run. 25.3.4.1
      # carries JDK 25.0.4.1, so it is clear. Note that `version:` and `java-version:` are
      # different knobs: java-version 25 on this distribution still resolves 25.0.2, which is why
      # the community line looked unusable for a while.
      #
      # Measured against Liberica NIK 25.0.4, the previous choice, on linux-amd64: 17,560 warm
      # requests a second against 7,697, 5.6 MiB off each binary, 5 MB off idle RSS, CLI start
      # halved (§14). What it costs is macos-amd64, which the 25.3 line does not build; Intel Macs
      # get the JAR.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3'
          native-image-job-reports: 'true'
      - name: Set version from the tag
        # Without this the binaries report the pom's 0.x.y-SNAPSHOT no matter which tag built them.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build (tests + native)
        run: ./mvnw -B -ntp -Pnative package
        shell: bash
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ matrix.target }}" = windows-amd64 ] && ext=.exe
          cp node/target/jailscale$ext dist/jailscale-${{ matrix.target }}$ext
          cp hub/target/jailhub$ext   dist/jailhub-${{ matrix.target }}$ext
          # The names to hash, built as they are produced rather than globbed afterwards. A glob
          # that matches nothing is the shape of bug this step already had: it listed *.jar, which
          # exists on one target of four, and 2>/dev/null turned the other three into a silent
          # exit 1 after a green build.
          names="jailscale-${{ matrix.target }}$ext jailhub-${{ matrix.target }}$ext"
          if [ "${{ matrix.target }}" = linux-amd64 ]; then
            cp node/target/jailscale.jar dist/jailscale.jar
            cp hub/target/jailhub.jar   dist/jailhub.jar
            names="$names jailscale.jar jailhub.jar"
          fi
          # macOS ships shasum and no sha256sum; the Windows runner's bash is the other way
          # round. Both print the same "<hash>  <name>" that the release job concatenates.
          # What built these, beside what they hash to. Which toolchain and options produced a
          # binary is a question nothing in the binary itself can answer (see Version.java), and a
          # locally built one can differ from this in size and speed without differing in
          # behaviour, so the answer is published next to the checksums.
          #
          # Asking native-image takes three tries and then refuses to give up quietly. On Windows it
          # is `native-image.cmd`, which bash does not find under the plain name, so `$(native-image
          # --version)` was the empty string and v0.1.1 published `toolchain:` followed by nothing
          # for windows-amd64 -- the one field this file exists for. A command substitution that
          # fails does not fail the step around it, which is why nothing said so.
          toolchain=""
          for ni in native-image "$GRAALVM_HOME/bin/native-image" "$GRAALVM_HOME/bin/native-image.cmd"; do
            if v=$("$ni" --version 2>/dev/null | tail -1) && [ -n "$v" ]; then toolchain="$v"; break; fi
          done
          if [ -z "$toolchain" ]; then
            echo "no native-image answered --version, so BUILDINFO would say nothing about the"
            echo "toolchain; tried the plain name and GRAALVM_HOME=$GRAALVM_HOME"
            exit 1
          fi
          {
            echo "target:        ${{ matrix.target }}"
            echo "commit:        ${{ github.sha }}"
            echo "ref:           ${{ github.ref_name }}"
            echo "toolchain:     $toolchain"
            echo "options:       -Pnative (no profile-guided optimization, see ARCHITECTURE.md §14)"
          } > "dist/BUILDINFO-${{ matrix.target }}.txt"
          grep -q "^toolchain:     ." "dist/BUILDINFO-${{ matrix.target }}.txt"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $names > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 $names > "SHA256SUMS-${{ matrix.target }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.target }}.txt"
          # BUILDINFO is deliberately not in its own checksum list; everything else must be.
          want=$(echo $names | wc -w)
          got=$(wc -l < "SHA256SUMS-${{ matrix.target }}.txt")
          [ "$got" -eq "$want" ] || { echo "hashed $got of $want files"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: native
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    # Job-scoped, and contents: write is restated because a job-level block replaces the top-level
    # one rather than adding to it. The other two are what an attestation needs: an OIDC token to
    # prove to Sigstore which workflow is asking, and the right to record the result.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Merge checksums and build info
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt && rm dist/SHA256SUMS-*.txt
          cat dist/BUILDINFO-*.txt > dist/BUILDINFO.txt && rm dist/BUILDINFO-*.txt
          cat dist/BUILDINFO.txt
      # Provenance for every file in SHA256SUMS.txt, which is the whole release: signed by Sigstore
      # against this workflow's own identity, so `gh attestation verify jailscale-linux-amd64 --repo
      # eth219/jailscale` says which workflow of which repository built it, from which commit.
      #
      # This is not the signature `update --download` checks, and it is not a second opinion on it
      # (§9.4). It answers "what built this", where the release key answers "who approved this" --
      # and only the second survives an account that has been taken over, because whoever can push a
      # tag can also make this workflow run and produce a perfectly valid attestation. What it is
      # load-bearing for is the signing step, which requires every asset to be attested as built
      # from the commit the maintainer's own clone says the tag names.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt

      # A draft, on purpose (§9.4). The release is signed after this, from a machine the pipeline
      # cannot reach -- `tools/sign-release.sh vX.Y.Z` re-hashes every asset, writes and signs
      # RELEASE.txt (the tag and the digest of SHA256SUMS.txt), and publishes. The signed manifest
      # is written by the person, not here: a release this job could sign on its own would be worth
      # what the checksums it also writes are worth. A release visible before its signature is up is
      # one that `jailscale update --download` refuses and that `update` has already announced.
      # `prerelease` from the tag, the same hyphen rule images.yml uses: a v0.2.0-rc1 that is
      # signed and published must not become `releases/latest`, which is what every node's daily
      # check reads and what `update --download` fetches. Updates.compare sorts an rc above the
      # release before it, so without this flag publishing a candidate announces it to the field.
      # Re-running this job for a tag whose release exists keeps that release's draft state: the
      # action only applies `draft` on creation (softprops v3, github.ts updateRelease).
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
      - name: Say what is left to do
        run: |
          {
            echo "### ${GITHUB_REF_NAME} is a draft"
            echo
            echo 'Sign and publish it from a machine that is not this one:'
            echo
            echo "    tools/sign-release.sh ${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
