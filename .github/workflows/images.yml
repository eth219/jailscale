name: images

# Container images for the hub and the node, published to GHCR.
#
# Each architecture builds on its own runner rather than under emulation: native-image cannot
# cross-compile, and building arm64 under qemu takes long enough to be useless. The per-arch
# images are pushed by digest, then a manifest list joins them under one tag.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hub
            image: jailhub
            runner: ubuntu-24.04
            arch: amd64
          - component: hub
            image: jailhub
            runner: ubuntu-24.04-arm
            arch: arm64
          - component: node
            image: jailscale
            runner: ubuntu-24.04
            arch: amd64
          - component: node
            image: jailscale
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.arch }}"
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - component: hub
            image: jailhub
          - component: node
            image: jailscale
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under one tag
        run: |
          set -eu
          repo="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          refs=""
          for f in /tmp/digests/*; do
            refs="$refs ${repo}@$(cat "$f")"
          done
          # A tag push gets both the version and latest; a main push only gets edge.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${{ github.ref_name }} latest"
          else
            tags="edge"
          fi
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "${repo}:${t}" $refs
            docker buildx imagetools inspect "${repo}:${t}"
          done
