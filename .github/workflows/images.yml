name: images

# Container images for the hub and the node, published to GHCR.
#
# Each architecture builds on its own runner rather than under emulation: native-image cannot
# cross-compile, and building arm64 under qemu takes long enough to be useless. The per-arch
# images are pushed by digest, then a manifest list joins them under one tag.
#
# The native binary is built here, by this workflow, and the Dockerfiles only package it. They used
# to build it themselves FROM ghcr.io/graalvm/native-image-community:25 -- which is GraalVM for JDK
# 25.0.2, the range ARCHITECTURE.md §3.2 forbids and release.yml is pinned away from, and that
# registry publishes nothing newer for JDK 25. So the toolchain moved out of the image and is now
# the release's: same distribution, same version, same options. That makes this the release binary
# in the sense that matters, though not byte-identical, which native-image does not promise.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hub
            image: jailhub
            runner: ubuntu-24.04
            arch: amd64
          - component: hub
            image: jailhub
            runner: ubuntu-24.04-arm
            arch: arm64
          - component: node
            image: jailscale
            runner: ubuntu-24.04
            arch: amd64
          - component: node
            image: jailscale
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The release's toolchain, and the reasoning for the pin is in release.yml: GraalVM CE on the
      # 25.3 line, a JDK newer than 25.0.2, and `version:` rather than `java-version:` because the
      # latter resolves 25.0.2 on this distribution. Two files now pin this and they have to move
      # together; the images shipped a forbidden JDK for as long as they did because this one was a
      # base-image tag instead, where nothing made the mismatch visible.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3'

      - name: Set version from the tag
        # Without this the binary in the image reports the pom's 0.x.y-SNAPSHOT, whatever tag the
        # image is published under. release.yml does the same thing for the same reason.
        if: github.ref_type == 'tag'
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # -DskipTests on purpose: `ci` is the gate and these images are packaging, not verification
      # (ARCHITECTURE.md §3.2). One module, not the whole build: each job packages one component.
      - name: Build the native binary
        run: ./mvnw -B -ntp -DskipTests -Pnative -pl ${{ matrix.component }} -am package

      # The runtime base carries glibc, and the Dockerfile adds zlib because the binary needs it and
      # distroless/base does not have it. That list is hard-coded now, where the old Dockerfile read
      # it off `ldd` and would have failed loudly on a third library, so the check moves here: a new
      # dependency is a red job rather than an image that builds and dies at exec.
      - name: Check what the binary links against
        run: |
          set -eu
          bin=${{ matrix.component }}/target/${{ matrix.image }}
          ldd "$bin"
          unexpected=$(ldd "$bin" | awk '{print $1}' | grep -vE \
            '^(linux-vdso\.so\.1|libc\.so\.6|libz\.so\.1|/lib64/ld-linux-x86-64\.so\.2|/lib/ld-linux-aarch64\.so\.1)$' || true)
          if [ -n "$unexpected" ]; then
            echo "the image carries libc and zlib only, and this also needs: $unexpected"
            echo "either add it to deploy/Dockerfile.${{ matrix.component }} or to the list above"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          # The binary the step above produced. It is the Dockerfile's default as well, so a local
          # `docker build -f deploy/Dockerfile.node .` needs no argument.
          build-args: |
            BIN=${{ matrix.component }}/target/${{ matrix.image }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # No layer cache: what was expensive to build is no longer built here, and the image is
          # now two small COPYs whose cache would save nothing worth the chance of serving a stale
          # layer for a binary that changed.

      # Start what was just pushed. Three faults shipped at once because this workflow built and
      # pushed images and never ran one: a runtime base with no libc, so every image ever published
      # died at exec; a state volume owned by root against a USER of nonroot, so the daemon could
      # not write its own state; and a CMD that made the node container exit as soon as it started.
      # This runs before the digest is exported, so a broken image never reaches the manifest job
      # and never becomes :edge, :latest or a version tag.
      - name: Smoke-test the pushed image
        run: |
          set -eu
          img="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

          # Does it run at all? Asserted on the output as well as the exit status, so a runtime that
          # swallows the exec failure still fails here.
          docker run --rm "$img" version | tee /tmp/version.txt
          # The binary is named after the image: jailhub prints "jailhub <v>", jailscale likewise.
          grep -q "^${{ matrix.image }} " /tmp/version.txt

          # And can it write its own state? A fresh named volume arrives owned by root unless the
          # image carries that directory with an owner. Only the node answers this in one command:
          # the hub writes its state from `serve`, which wants ports, a certificate and ACME. Both
          # images build the directory the same way, so the node covers the construction.
          if [ "${{ matrix.component }}" = node ]; then
            docker volume create smoke-state >/dev/null
            docker run -d --name smoke -v smoke-state:/var/lib/jailscale "$img" >/dev/null
            for _ in $(seq 30); do
              if docker logs smoke 2>&1 | grep -q "machine key"; then break; fi
              sleep 1
            done
            docker logs smoke
            docker logs smoke 2>&1 | grep -q "machine key" \
              || { echo "the daemon did not start on a fresh state volume"; exit 1; }
            docker rm -f smoke >/dev/null
          fi

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.arch }}"
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - component: hub
            image: jailhub
          - component: node
            image: jailscale
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under one tag
        run: |
          set -eu
          repo="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          refs=""
          for f in /tmp/digests/*; do
            refs="$refs ${repo}@$(cat "$f")"
          done
          # A tag push gets both the version and latest; a main push only gets edge.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${{ github.ref_name }} latest"
          else
            tags="edge"
          fi
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "${repo}:${t}" $refs
            docker buildx imagetools inspect "${repo}:${t}"
          done
          # The tag is what anyone actually pulls, and joining architectures is its own way to go
          # wrong, so run one of them: this runner is amd64 and takes that arch out of the list.
          first=$(echo $tags | cut -d' ' -f1)
          docker run --rm "${repo}:${first}" version
