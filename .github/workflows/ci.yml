# The gate every commit passes (ARCHITECTURE.md §3.2, §14). The release workflow used to be the
# only place the tests ran, and it runs on a tag or a manual dispatch, so a regression on main
# stayed invisible until someone cut a release; the image workflow builds with -DskipTests.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'   # 03:17 KST, for the platforms too slow or too flaky for every push
  workflow_dispatch:

# A newer push supersedes an older one on the same ref; a tag build is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every push and pull request. Both of these platforms are clean: in 240 runs per shard neither
  # produced a spurious failure (§3.2).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # JDK 25.0.3 or newer, for the virtual-thread timer fixes named in ARCHITECTURE.md §3.2.
      # 'liberica' + '25' resolves to the newest 25.0.x, which is what the release workflow builds on.
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
      - run: ./mvnw -B -ntp package
        shell: bash

  # Windows is a nightly job, not a per-push one. It used to be because a virtual thread there could
  # lose a socket wake-up and fail about 2% of MuxSessionTest runs; that one is fixed (§3.2, and
  # docs/windows-virtual-thread-stall has the before and after). It stays nightly until Windows has
  # the run count that promoted the two platforms above, and once a day catches a Windows-only
  # regression meanwhile.
  test-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
      - run: ./mvnw -B -ntp package
        shell: bash

  # Static analysis (pom.xml, profile `analyze`). Its own job because it is the one thing here that
  # downloads a third-party tool: keeping it off `package` is what lets someone build jailscale
  # from source with nothing but a JDK, which §3.2 argues for. Every exclusion in
  # spotbugs-exclude.xml carries its reason, so a red gate here means a finding nobody has answered.
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
      - run: ./mvnw -B -ntp -Panalyze verify -DskipTests
        shell: bash

  # The lightweight budget of §14. It needs the native binaries, so it costs a native-image build
  # and does not belong on a pull request; main and the nightly run are enough to catch a drift.
  budget:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'liberica'
      - name: measure.sh needs bc, which the runner image does not ship
        run: sudo apt-get update && sudo apt-get install -y bc
      - name: Build the binaries
        run: ./mvnw -B -ntp -Pnative package
      - name: Budget gate
        run: LOAD=1000 ./measure.sh --check
