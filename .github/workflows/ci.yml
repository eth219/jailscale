# The gate every commit passes (ARCHITECTURE.md §3.2, §14). The release workflow used to be the
# only place the tests ran, and it runs on a tag or a manual dispatch, so a regression on main
# stayed invisible until someone cut a release; the image workflow builds with -DskipTests.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'   # 03:17 KST: it catches drift in the runner images and in what the
                            # pinned toolchain lines resolve to, and it is what watches the signed
                            # release index for its expiry (the `index` job below).
  workflow_dispatch:

# A newer push supersedes an older one on the same ref; a tag build is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nightly only. The signed pointer that says which release is current expires every 90 days and is
  # re-issued by hand from the maintainer's machine (docs/update-freshness) -- which means the whole
  # scheme rests on somebody noticing in time, and until this job existed the only reminder was the
  # one printed by a command nobody had a reason to run. Here it is a red nightly build two weeks
  # out instead. A repository with no pointer yet is not a failure: this has to be able to run
  # before the first one is published.
  index:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The signed release index is current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEYS_REV: HEAD # this checkout has no tags, and main's list is the one in the field
        run: |
          set -eu
          rc=0
          out=$(tools/verify-release.sh --index 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" = 0 ]; then
            case $out in
              *"less than two weeks left"*)
                echo "::warning::the release index expires soon; re-issue it with tools/refresh-index.sh" ;;
            esac
            exit 0
          fi
          case $out in
            *'has no release-index pointer yet'*)
              echo "::notice::no signed release index has been published yet; nothing to check."
              exit 0 ;;
          esac
          echo "::error::the signed release index does not check out. Re-issue it with tools/refresh-index.sh"
          exit 1

  # Every push and pull request. Each platform is here because it was measured clean rather than
  # assumed: ubuntu and macos produced no spurious failure in 240 runs per shard (§3.2), and Windows
  # joined them once the poller stall that used to fail about 2% of MuxSessionTest runs was fixed --
  # 0 in 3,000 runs of the same transfer, five clean suites, and the reproducer variants that pin the
  # cause, all in docs/windows-virtual-thread-stall. The Windows job costs 1.5 min against the other
  # two at 1.2, so holding it back to nightly bought nothing but a slower signal.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # JDK 25.0.3 or newer, for the virtual-thread timer fixes named in ARCHITECTURE.md §3.2.
      # The tests run on the newest 25.0.x, a different line from the release's (§3.2); what they
      # need from a JDK is that it is not 25.0.0-25.0.2, and both lines satisfy that.
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
      - run: ./mvnw -B -ntp package
        shell: bash

  # Static analysis (pom.xml, profile `analyze`). Its own job because it is the one thing here that
  # downloads a third-party tool: keeping it off `package` is what lets someone build jailscale
  # from source with nothing but a JDK, which §3.2 argues for. Every exclusion in
  # spotbugs-exclude.xml carries its reason, so a red gate here means a finding nobody has answered.
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
      - run: ./mvnw -B -ntp -Panalyze verify -DskipTests
        shell: bash

  # Every self-test in tools/, through tools/self-test.sh. Its own job, with no JDK and no Maven,
  # because that is all it needs and a red here should mean a tools/ script broke and nothing else.
  # It is not a step on `analyze` for the reason ci-full.yml is its own file: a job's comment is
  # what a red is read against, and `analyze` says a red there is a SpotBugs finding nobody
  # answered. Until this existed, tools/ held twelve scripts -- two of which sign a release -- and
  # CI ran a test for none of them (#192).
  tools:
    runs-on: ubuntu-24.04
    # Nothing here should take a minute. Without this a self-test that blocks holds a runner for
    # the six-hour default, and because the runner captures each script's output, a hang shows
    # nothing at all about which one.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: tools/self-test.sh
        shell: bash
