# The gate every commit passes (ARCHITECTURE.md §3.2, §14). The release workflow used to be the
# only place the tests ran, and it runs on a tag or a manual dispatch, so a regression on main
# stayed invisible until someone cut a release; the image workflow builds with -DskipTests.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'   # 03:17 KST: nothing is gated on it now, but it catches drift in the
                            # runner images and in what the pinned toolchain lines resolve to.
  workflow_dispatch:

# A newer push supersedes an older one on the same ref; a tag build is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every push and pull request. Each platform is here because it was measured clean rather than
  # assumed: ubuntu and macos produced no spurious failure in 240 runs per shard (§3.2), and Windows
  # joined them once the poller stall that used to fail about 2% of MuxSessionTest runs was fixed --
  # 0 in 3,000 runs of the same transfer, five clean suites, and the reproducer variants that pin the
  # cause, all in docs/windows-virtual-thread-stall. The Windows job costs 1.5 min against the other
  # two at 1.2, so holding it back to nightly bought nothing but a slower signal.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # JDK 25.0.3 or newer, for the virtual-thread timer fixes named in ARCHITECTURE.md §3.2.
      # The tests run on the newest 25.0.x, a different line from the release's (§3.2); what they
      # need from a JDK is that it is not 25.0.0-25.0.2, and both lines satisfy that.
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
      - run: ./mvnw -B -ntp package
        shell: bash

  # Static analysis (pom.xml, profile `analyze`). Its own job because it is the one thing here that
  # downloads a third-party tool: keeping it off `package` is what lets someone build jailscale
  # from source with nothing but a JDK, which §3.2 argues for. Every exclusion in
  # spotbugs-exclude.xml carries its reason, so a red gate here means a finding nobody has answered.
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
      - run: ./mvnw -B -ntp -Panalyze verify -DskipTests
        shell: bash

  # The load-tagged tests, which the default build excludes (surefire's excludedGroups in pom.xml)
  # and which nothing else ran: `-Dgroups=load` appeared in no workflow, so LoadTest only ever ran
  # when somebody remembered to type it. measure.sh LOAD= is not a substitute -- it samples RSS
  # against the budget and never asks whether each of the 1,000 visitors got its own answer, which
  # is what this asserts. On the JVM, so it needs no native build; off pull requests only because
  # it holds a thousand sockets open and that is a poor use of every push.
  load:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
      # -Dtest.excludedGroups= empties the pom's property, which is what excludes the tag; surefire's
      # own -DexcludedGroups would be overridden by the configuration block and do nothing.
      - run: ./mvnw -B -ntp -pl hub -am test -Dgroups=load -Dtest.excludedGroups=
        shell: bash

  # The lightweight budget of §14. It needs the native binaries, so it costs a native-image build
  # and does not belong on a pull request; main and the nightly run are enough to catch a drift.
  budget:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The same toolchain and options the release uses, so the gate measures what ships. A gate on
      # a different build than the release is worse than no gate: this once ran on a toolchain
      # nobody released with, and §14 ended up claiming macOS binaries 4.6 MiB smaller than the
      # ones v0.1.0 actually published.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          version: '25.3'
      - name: measure.sh needs bc, which the runner image does not ship
        run: sudo apt-get update && sudo apt-get install -y bc
      - name: Build the binaries
        run: ./mvnw -B -ntp -Pnative package
      - name: Budget gate
        # RATE also measures throughput, which nothing gates: it is only comparable against another
        # run on the same machine, and it is here so a build that trades CPU for footprint shows up.
        # 200 handshakes a second rather than the default 400, because a handshake costs this runner
        # 3.5 to 4.4 ms of hub and node CPU together: at 400 the four cores were three-quarters busy
        # and the per-operation figure was measuring contention as much as code. It was 5.6 ms when
        # this was chosen, on the toolchain before the current one, so there is room to revisit it.
        #
        # SLOW= is the third axis and the only one that reaches the receive budget of §5.3: LOAD=
        # holds sessions with no bytes in flight, so the hub's queues are empty and its peak says
        # nothing about what a stalled reader costs. It was measured by hand and left out of here,
        # which meant the one axis §14 records as over its budget was also the one axis no run on
        # main looked at. Both of its gates have teeth -- the node's peak RSS, and the hub's receive
        # queue high-water, which is exact and reproduces at the budget every run -- and the failure
        # they exist to catch drove the node past 200 MB.
        #
        # SLOW=1000 because the node bounds its concurrent visitors now (§9.3). It ran at 400 for
        # a day, when a thousand stalled readers reached the open per-visitor defect instead of a
        # peak -- and at 400 the hub's receive queue never got past 4.7 MB of its 24 MB budget on
        # this runner, so the one exact assertion in this phase could not fail here. A thousand is
        # what reaches it. measure.sh's B_NODE_SLOW_AT holds the count the node budget was measured
        # at and refuses to apply it at any other.
        run: LOAD=1000 SLOW=1000 RATE=8 RATE_HANDSHAKES=200 ./measure.sh --check
